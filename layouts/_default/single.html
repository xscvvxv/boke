{{ define "main" }}
  <article class="post">
    <header class="post-header">
      <h1>{{ .Title }}</h1>
      <div class="post-meta">
        <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format (site.Params.dateFormat | default "2006-01-02") }}</time>
        {{ with .Params.author }}<span class="author">{{ . }}</span>{{ end }}
        {{ with .Params.tags }}<span class="tags">{{ range . }}<a href="{{ "/tags/" | relURL }}{{ . | urlize }}">#{{ . }}</a>{{ end }}</span>{{ end }}
      </div>
    </header>
    <div class="post-content">
      {{ .Content }}
    </div>
    <footer class="post-footer">
      <a href="{{ "/" | relURL }}">← 返回首页</a>
    </footer>
  </article>
{{ end }}
